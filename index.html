<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PREVISIÓN BICI PRO</title>
    <style>
        :root {
            --low: #e0f2fe;
            --med: #7dd3fc;
            --high: #0369a1;
            --cold: #38bdf8;
            --hot: #fb923c;
            --danger: #ef4444;
            --bg: #000;
        }

        * {
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            background: #1a1a1a;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .phone-container {
            width: 100%;
            max-width: 450px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        .header-title {
            background: #222;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 1.1rem;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-btns {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .loc-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 5px;
        }

        .accu-header-btn {
            background: #f58220;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.7rem;
            font-weight: 900;
            color: black;
            text-decoration: none;
        }

        #section-48h,
        #section-15d {
            padding: 5px;
            flex-grow: 1;
            margin-bottom: 80px;
        }

        #section-15d {
            display: none;
        }

        .day-divider {
            background: #222;
            color: #7dd3fc;
            padding: 12px;
            text-align: center;
            font-size: 0.85rem;
            border-radius: 8px;
            margin: 15px 0 8px 0;
            border-left: 5px solid var(--med);
            letter-spacing: 1px;
        }

        .card {
            border-radius: 18px;
            padding: 4px;
            margin-bottom: 6px;
            display: grid;
            gap: 4px;
            border: 3px solid transparent;
            height: 110px;
            grid-template-columns: 90px 1fr 1fr 1fr;
            cursor: pointer;
        }

        .risk-low {
            background: var(--low);
            border-color: var(--low);
        }

        .risk-med {
            background: var(--med);
            border-color: var(--med);
        }

        .risk-high {
            background: var(--high);
            border-color: var(--high);
        }

        .sub-box {
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            background: var(--bg);
            padding: 4px 2px;
            overflow: hidden;
            justify-content: space-between;
        }

        .label {
            align-self: stretch;
            text-align: center;
            font-size: 0.55rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .time-tag-big {
            font-size: 1.1rem;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .weather-icon-big {
            font-size: 3.3rem;
            line-height: 0.7;
            margin: auto 0;
        }

        .val-big {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 0.75;
            letter-spacing: -1.5px;
            margin: auto 0;
        }

        .val-small {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .color-temp-hot {
            color: #fb923c;
        }

        .color-temp-cold {
            color: #38bdf8;
        }

        .color-rain {
            color: #60a5fa;
        }

        .color-wind-warn {
            color: #facc15;
        }

        .color-wind-danger {
            color: #ef4444;
        }

        .dim {
            opacity: 0.3;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 200;
            padding: 15px;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: var(--danger);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .grid-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .detail-item {
            background: #111;
            padding: 15px;
            border-radius: 16px;
            border: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-item span:first-child {
            color: var(--med);
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .detail-item .num-heavy {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
        }

        .detail-item .unit {
            font-size: 0.9rem;
            color: #888;
            margin-left: 2px;
        }

        .nav-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: #222;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 450px;
        }

        .nav-btn {
            background: #333;
            color: #888;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .nav-btn.active {
            background: #444;
            color: #fff;
        }
    </style>
</head>

<body onload="init()">

    <div id="detail-modal" class="modal">
        <div class="modal-header">
            <h2 id="modal-date" style="margin:0; font-size: 1.4rem; color: var(--med);"></h2>
            <button class="close-btn" onclick="closeModal()">X</button>
        </div>
        <div id="modal-body" class="grid-detail"></div>
    </div>

    <div class="phone-container">
        <div class="header-title">
            <div class="header-btns">
                <button class="loc-btn" onclick="searchCity()">🔍</button>
                <a id="accu-now-link" href="#" target="_blank" class="accu-header-btn">ACCU NOW</a>
            </div>
            <span id="main-title">Próximas 48 Horas</span>
            <div style="width:40px"></div>
        </div>

        <div id="section-48h"></div>
        <div id="section-15d"></div>

        <nav class="nav-bar">
            <button id="btn-48h" class="nav-btn active" onclick="showSection('48h')">48 HORAS</button>
            <button id="btn-15d" class="nav-btn" onclick="showSection('15d')">15 DÍAS</button>
        </nav>
    </div>

    <script>
        let LAT = 40.342, LON = -3.831;
        let dailyData = null;
        let municipiosCache = null;
        const weatherIcons = { 0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 51: "🌦️", 61: "🌧️", 80: "🌦️", 95: "⛈️" };

        async function init() {
            // 1. Carga inmediata para evitar pantalla en blanco en el móvil
            let lastId = '28079';
            let lastName = 'MADRID';
            try {
                lastId = localStorage.getItem('last_id') || '28079';
                lastName = localStorage.getItem('last_nombre') || 'MADRID';
            } catch (e) { }

            document.getElementById('main-title').innerText = lastName.toUpperCase();
            fetchWeather(lastId);

            // 2. Intento de geolocalización en segundo plano
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        try {
                            LAT = pos.coords.latitude;
                            LON = pos.coords.longitude;
                            localStorage.setItem('lat', LAT);
                            localStorage.setItem('lon', LON);
                            updateLinks();

                            const idMunicipio = await getMunicipioIdByCoords(LAT, LON);
                            if (idMunicipio && idMunicipio !== lastId) {
                                fetchWeather(idMunicipio);
                            }
                        } catch (e) { }
                    },
                    (err) => {
                        console.log("Geolocalización no disponible o rechazada.");
                    },
                    { timeout: 10000, enableHighAccuracy: false }
                );
            }
        }

        async function getMunicipioIdByCoords(lat, lon) {
            try {
                // Nominatim a veces bloquea peticiones sin identificar. Añadimos un zoom y lenguaje específico.
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`, {
                    headers: { 'Accept-Language': 'es' }
                });
                const data = await response.json();
                const addr = data.address;
                const cityName = addr.city || addr.town || addr.village || addr.municipality || addr.county || addr.state;

                if (!cityName) return null;

                const municipios = await getMunicipiosList();
                if (!municipios || municipios.length === 0) return null;

                const normalizedSearch = cityName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

                let found = municipios.find(m => m.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() === normalizedSearch);
                if (!found) {
                    found = municipios.find(m => {
                        const mName = m.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                        return mName.includes(normalizedSearch) || normalizedSearch.includes(mName);
                    });
                }
                return found ? found.id.slice(-5) : null;
            } catch (e) { return null; }
        }

        function updateLinks() {
            document.getElementById('accu-now-link').href = `https://www.accuweather.com/es/search-locations?query=${LAT},${LON}`;
        }

        async function getMunicipiosList() {
            if (municipiosCache) return municipiosCache;
            try {
                const cached = localStorage.getItem('municipios_cache');
                if (cached) {
                    municipiosCache = JSON.parse(cached);
                    return municipiosCache;
                }
            } catch (e) { }

            const apiKey = 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbnRvbmlvZGV0bUBnbWFpbC5jb20iLCJqdGkiOiIzZTcxNTZmNC05YzZiLTQyMDMtYmE2YS0zZTRiYTAxMmQxNDUiLCJleHAiOjE3OTU1MDI1OTksImlzcyI6IkFFTUVUIiwiaWF0IjoxNzg2ODYyNTk5LCJ1c2VySWQiOiIzZTcxNTZmNC05YzZiLTQyMDMtYmE2YS0zZTRiYTAxMmQxNDUiLCJyb2xlIjoiIn0.PhW1cv27D88wKrZb2kFFP2NqQVmy23h35uiYjVTjqFY';
            try {
                const resMunicipiosUrl = await fetch(`https://opendata.aemet.es/opendata/api/maestro/municipios?api_key=${apiKey}`);
                const dataMunicipiosUrl = await resMunicipiosUrl.json();
                const resMunicipiosList = await fetch(dataMunicipiosUrl.datos);
                const buffer = await resMunicipiosList.arrayBuffer();
                const decoder = new TextDecoder('windows-1252');
                const municipios = JSON.parse(decoder.decode(buffer));
                municipiosCache = municipios;
                localStorage.setItem('municipios_cache', JSON.stringify(municipios));
                return municipiosCache;
            } catch (e) { return []; }
        }

        async function searchCity() {
            const city = prompt("Escribe el nombre de la ciudad:");
            if (!city) return;
            document.getElementById('section-15d').innerHTML = '<div class="day-divider">BUSCANDO...</div>';
            document.getElementById('section-48h').innerHTML = '<div class="day-divider">BUSCANDO...</div>';
            try {
                const normalizedCity = city.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
                const municipios = await getMunicipiosList();
                let found = municipios.find(m => m.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() === normalizedCity);
                if (!found) found = municipios.find(m => m.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(normalizedCity));
                if (found) fetchWeather(found.id.slice(-5));
                else { alert("No encontrado."); fetchWeather(); }
            } catch (e) { fetchWeather(); }
        }

        async function fetchWeather(idMunicipio = '28079') {
            localStorage.setItem('last_id', idMunicipio);
            document.getElementById('section-15d').innerHTML = '<div class="day-divider">CARGANDO...</div>';
            document.getElementById('section-48h').innerHTML = '<div class="day-divider">CARGANDO...</div>';
            const API_KEY_AEMET = 'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbnRvbmlvZGV0bUBnbWFpbC5jb20iLCJqdGkiOiIzZTcxNTZmNC05YzZiLTQyMDMtYmE2YS0zZTRiYTAxMmQxNDUiLCJleHAiOjE3OTU1MDI1OTksImlzcyI6IkFFTUVUIiwiaWF0IjoxNzg2ODYyNTk5LCJ1c2VySWQiOiIzZTcxNTZmNC05YzZiLTQyMDMtYmE2YS0zZTRiYTAxMmQxNDUiLCJyb2xlIjoiIn0.PhW1cv27D88wKrZb2kFFP2NqQVmy23h35uiYjVTjqFY';
            try {
                const [dailyResult, hourlyResult] = await Promise.all([
                    fetchAemetData(`https://opendata.aemet.es/opendata/api/prediccion/especifica/municipio/diaria/${idMunicipio}/?api_key=${API_KEY_AEMET}`),
                    fetchAemetData(`https://opendata.aemet.es/opendata/api/prediccion/especifica/municipio/horaria/${idMunicipio}/?api_key=${API_KEY_AEMET}`)
                ]);
                if (dailyResult && dailyResult[0]) {
                    const nombre = dailyResult[0].nombre;
                    document.getElementById('main-title').innerText = nombre.toUpperCase();
                    localStorage.setItem('last_nombre', nombre);
                    dailyData = adaptarDatosAemet(dailyResult[0].prediccion.dia);
                    render15d(dailyData);
                }
                if (hourlyResult && hourlyResult[0] && hourlyResult[0].prediccion) {
                    const hourlyAdaptedData = adaptarDatosAemetHoraria(hourlyResult[0].prediccion.dia);
                    render48h(hourlyAdaptedData);
                } else {
                    document.getElementById('section-48h').innerHTML = '<div class="day-divider">PREDICCIÓN HORARIA NO DISPONIBLE</div>';
                }
            } catch (error) {
                document.getElementById('section-48h').innerHTML = '<div class="day-divider">ERROR DE CONEXIÓN</div>';
            }
        }

        async function fetchAemetData(urlPeticion) {
            try {
                const resInicial = await fetch(urlPeticion);
                const dataInicial = await resInicial.json();
                if (dataInicial.estado === 200) {
                    const resDatos = await fetch(dataInicial.datos);
                    return await resDatos.json();
                }
                return null;
            } catch (e) { return null; }
        }

        function closeModal() { document.getElementById('detail-modal').style.display = 'none'; }

        function createCard(title, iconCode, t1, t2, p1, p2, w1, w2, index = null) {
            const risk = (p1 > 40 || p2 > 0.5 || w1 > 30) ? 'risk-high' : (p1 > 15 || w1 > 18) ? 'risk-med' : 'risk-low';
            const click = index !== null ? `onclick="openDetail(${index})"` : '';
            const tClass = t1 > 28 ? 'color-temp-hot' : (t1 < 10 ? 'color-temp-cold' : '');
            const pClass = p1 > 0 ? 'color-rain' : 'dim';
            const wClass = w1 > 25 ? 'color-wind-danger' : (w1 > 15 ? 'color-wind-warn' : '');
            return `<div class="card ${risk}" ${click}>
                <div class="sub-box"><div class="time-tag-big">${title}</div><div class="weather-icon-big">${weatherIcons[iconCode] || "🌤️"}</div></div>
                <div class="sub-box"><span class="label">TEMP</span><span class="val-big ${tClass}">${t1}°</span><span class="val-small">${t2}°</span></div>
                <div class="sub-box"><span class="label">LLUVIA</span><span class="val-big ${pClass}">${p1 > 0 ? p1 + '%' : '-'}</span><span class="val-small">${p2 > 0 ? p2.toFixed(1) + 'm' : ''}</span></div>
                <div class="sub-box"><span class="label">VIENTO</span><span class="val-big ${wClass}">${w1}</span><span class="val-small">${w2 > 0 ? '(' + w2 + ')' : ''}</span></div>
            </div>`;
        }

        function render48h(h) {
            const list = document.getElementById('section-48h');
            let html = ''; const now = new Date(); const currentHour = now.getHours(); const today = now.getDate();
            let startIndex = h.time.findIndex(t => { const d = new Date(t); return d.getDate() === today && d.getHours() === currentHour; });
            if (startIndex === -1) startIndex = 0;
            let lastDay = -1;
            for (let i = startIndex; i < startIndex + 48; i++) {
                if (!h.time[i]) break;
                const d = new Date(h.time[i]);
                if (d.getDate() !== lastDay) {
                    if (i !== startIndex) html += `<div class="day-divider">${d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric' }).toUpperCase()}</div>`;
                    lastDay = d.getDate();
                }
                html += createCard(`${d.getHours()}:00`, h.weather_code[i], Math.round(h.temperature_2m[i]), Math.round(h.apparent_temperature[i]), h.precipitation_probability[i], h.precipitation[i], Math.round(h.wind_speed_10m[i]), Math.round(h.wind_gusts_10m[i]));
            }
            list.innerHTML = html;
        }

        function render15d(d) {
            const list = document.getElementById('section-15d');
            let html = '';
            for (let i = 0; i < 15; i++) {
                const date = new Date(d.time[i]);
                const dayLabel = date.toLocaleDateString('es-ES', { weekday: 'short' }).toUpperCase().replace('.', '');
                html += createCard(`${dayLabel} ${date.getDate()}`, d.weather_code[i], Math.round(d.temperature_2m_max[i]), Math.round(d.temperature_2m_min[i]), d.precipitation_probability_max[i], d.precipitation_sum[i], Math.round(d.wind_speed_10m_max[i]), Math.round(d.wind_gusts_10m_max[i]), i);
            }
            list.innerHTML = html;
        }

        function adaptarDatosAemet(diasAemet) {
            const daily = { time: [], weather_code: [], temperature_2m_max: [], temperature_2m_min: [], precipitation_probability_max: [], precipitation_sum: [], wind_speed_10m_max: [], wind_gusts_10m_max: [], apparent_temperature_max: [], uv_index_max: [], sunrise: [], sunset: [] };
            diasAemet.forEach(dia => {
                daily.time.push(dia.fecha); daily.temperature_2m_max.push(dia.temperatura.maxima); daily.temperature_2m_min.push(dia.temperatura.minima);
                daily.precipitation_probability_max.push(Math.max(...dia.probPrecipitacion.map(p => p.value)));
                daily.wind_speed_10m_max.push(dia.viento.length > 0 ? Math.max(...dia.viento.map(p => p.velocidad)) : 0);
                daily.wind_gusts_10m_max.push(dia.rachaMax.length > 0 ? Math.max(...dia.rachaMax.map(p => p.value)) : 0);
                daily.apparent_temperature_max.push(dia.sensTermica?.maxima || dia.temperatura.maxima);
                daily.uv_index_max.push(dia.uvMax?.value || 0); daily.precipitation_sum.push(0);
                daily.sunrise.push(dia.orto || "00:00"); daily.sunset.push(dia.ocaso || "00:00");
            });
            return daily;
        }

        function adaptarDatosAemetHoraria(diasAemet) {
            const res = { time: [], weather_code: [], temperature_2m: [], apparent_temperature: [], precipitation_probability: [], precipitation: [], wind_speed_10m: [], wind_gusts_10m: [] };
            const map = { "11": 0, "12": 1, "13": 2, "14": 3, "15": 3, "16": 3, "17": 2, "43": 51, "44": 51, "45": 61, "46": 61, "23": 51, "24": 61, "25": 61, "26": 61, "81": 45, "82": 45, "51": 95, "52": 95, "53": 95, "54": 95, "61": 95, "62": 95, "63": 95, "64": 95 };
            const now = new Date(); now.setMinutes(0, 0, 0);
            diasAemet.forEach(dia => {
                const base = dia.fecha.substring(0, 10);
                for (let h = 0; h < 24; h++) {
                    const p = h.toString().padStart(2, '0'); const f = `${base}T${p}:00:00`;
                    if (new Date(f) < now) continue;
                    const get = (arr, k) => { const x = arr?.find(i => i.periodo == p); if (!x) return 0; const v = x[k] !== undefined ? x[k] : x.value; return Array.isArray(v) ? v[0] : v; };
                    res.time.push(f);
                    res.temperature_2m.push(parseFloat(get(dia.temperatura)) || 0);
                    res.apparent_temperature.push(parseFloat(get(dia.sensTermica)) || 0);
                    res.precipitation_probability.push(parseInt(get(dia.probPrecipitacion)) || 0);
                    res.precipitation.push(parseFloat(get(dia.precipitacion)) || 0);
                    res.weather_code.push(map[String(get(dia.estadoCielo)).replace('n', '')] || 1);
                    res.wind_speed_10m.push(parseInt(get(dia.viento, 'velocidad')) || 0);
                    res.wind_gusts_10m.push(parseInt(get(dia.rachaMax)) || 0);
                }
            });
            return res;
        }

        function openDetail(i) {
            const d = dailyData; const dt = new Date(d.time[i]).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
            document.getElementById('modal-date').innerText = dt;
            document.getElementById('modal-body').innerHTML = `
                <div class="detail-item"><span>🌡️ TEMP MÁX</span><div class="num-heavy">${Math.round(d.temperature_2m_max[i])}<span class="unit">°C</span></div></div>
                <div class="detail-item"><span>❄️ TEMP MÍN</span><div class="num-heavy">${Math.round(d.temperature_2m_min[i])}<span class="unit">°C</span></div></div>
                <div class="detail-item"><span>🔥 SENSACIÓN</span><div class="num-heavy">${Math.round(d.apparent_temperature_max[i])}<span class="unit">°C</span></div></div>
                <div class="detail-item"><span>☀️ ÍNDICE UV</span><div class="num-heavy" style="color:${d.uv_index_max[i] > 6 ? 'var(--danger)' : '#fff'}">${Math.round(d.uv_index_max[i])}</div></div>
                <div class="detail-item"><span>💨 VIENTO/RACHA</span><div class="num-heavy">${Math.round(d.wind_gusts_10m_max[i])}<span class="unit">km/h</span></div></div>
                <div class="detail-item"><span>🌧️ LLUVIA TOTAL</span><div class="num-heavy">${d.precipitation_sum[i]}<span class="unit">mm</span></div></div>
                <div class="detail-item"><span>💧 PROB. LLUVIA</span><div class="num-heavy">${d.precipitation_probability_max[i]}<span class="unit">%</span></div></div>
                <div class="detail-item"><span>🌅 AMANECER</span><div class="num-heavy" style="font-size:1.5rem">${d.sunrise[i].replace('T', '')}</div></div>
                <div class="detail-item"><span>🌇 ATARDECER</span><div class="num-heavy" style="font-size:1.5rem">${d.sunset[i].replace('T', '')}</div></div>
            `;
            document.getElementById('detail-modal').style.display = 'block';
        }
        function showSection(s) {
            document.getElementById('section-48h').style.display = s === '48h' ? 'block' : 'none';
            document.getElementById('section-15d').style.display = s === '15d' ? 'block' : 'none';
            document.getElementById('btn-48h').className = `nav-btn ${s === '48h' ? 'active' : ''}`;
            document.getElementById('btn-15d').className = `nav-btn ${s === '15d' ? 'active' : ''}`;
        }
    </script>
</body>

</html>
